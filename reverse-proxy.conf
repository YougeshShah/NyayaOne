# Reverse proxy — routes by subdomain to the right internal container.
# Replace "yourdomain.com" everywhere below with your real domain once you
# have one, and point all these subdomains (A records) at this server's IP:
#   api.yourdomain.com    -> backend
#   admin.yourdomain.com  -> company-web (TrailBlaze staff)
#   firm.yourdomain.com   -> law-firm-web (law firms / institutions)
#   learn.yourdomain.com  -> student-web

server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 25m; # library PDF / avatar uploads

    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.yourdomain.com;
    location / {
        proxy_pass http://company-web:80;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name firm.yourdomain.com;
    location / {
        proxy_pass http://law-firm-web:80;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name learn.yourdomain.com;
    location / {
        proxy_pass http://student-web:80;
        proxy_set_header Host $host;
    }
}

# --- HTTPS ---
# Once you have a real domain, run certbot against this server (see the
# deployment README) to get free SSL certs and add matching `listen 443 ssl`
# blocks for each server above — certbot can also do this automatically with
# `certbot --nginx`.
