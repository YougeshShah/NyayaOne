services:
  postgres:
    image: postgres:16-alpine
    container_name: nyayaone_postgres_prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - nyayaone_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nyayaone_net
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nyayaone_backend_prod
    restart: unless-stopped
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      PORT: 8080
    volumes:
      - nyayaone_uploads:/app/uploads
    networks:
      - nyayaone_net
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
  company-web:
    build:
      context: ./company-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.technocraftx.com/api/v1
    container_name: nyayaone_company_web_prod
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - nyayaone_net
  law-firm-web:
    build:
      context: ./law-firm-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.technocraftx.com/api/v1
    container_name: nyayaone_law_firm_web_prod
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - nyayaone_net
  student-web:
    build:
      context: ./student-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.technocraftx.com/api/v1
    container_name: nyayaone_student_web_prod
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - backend
    networks:
      - nyayaone_net
networks:
  nyayaone_net:
    driver: bridge
volumes:
  nyayaone_pg_data:
    driver: local
  nyayaone_uploads:
    driver: local
