server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app — any route not matching a real file falls back to
    # index.html so React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively — Vite fingerprints filenames
    # on every build, so a new deploy naturally gets fresh URLs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
