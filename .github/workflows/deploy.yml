name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to Remote Server
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 $SSH_USER@$SERVER_IP << 'EOF'
          set -e
          cd /var/www/projects/NyayaOne
          # NOTE: .git ownership occasionally reverts to root (cause not
          # fully understood -- possibly a side effect of some earlier
          # "sudo docker ..." command). Attempted an automatic
          # "sudo chown" fix here, but it failed specifically under
          # GitHub Actions' SSH agent ("sudo: a password is required")
          # despite working fine from an interactive session with
          # passwordless sudo confirmed -- reverted rather than risk this
          # blocking every deploy. If "git pull" ever fails with
          # "Permission denied" here again, SSH in manually and run:
          #   sudo chown -R ubuntu:ubuntu /var/www/projects/NyayaOne
          git pull origin main
          # Build first (while old containers keep serving traffic), one service
          # at a time -- this small VPS chokes if all 5 services build in
          # parallel. Only THEN swap old containers for new ones, so
          # downtime is just the brief down+up gap, not the whole build.
          # (--parallel is a global docker compose flag, must come right
          # after "compose" -- placed after "build" it was silently treated
          # as a bogus service name, and without "set -e" the whole script
          # kept going and reported success anyway, without rebuilding.)
          sudo docker compose --parallel 1 --env-file .env.prod build
          sudo docker compose --env-file .env.prod down
          sudo docker compose --env-file .env.prod up -d --no-deps
          sudo docker image prune -f
          # NOTE: build cache is intentionally NOT auto-pruned here anymore --
          # doing so after every deploy forced every following deploy to
          # rebuild from scratch (no cache), which took long enough to trip
          # SSH's connection timeout ("broken pipe"). Prune it manually
          # every so often instead: ssh in, run "docker builder prune -af".
        EOF
