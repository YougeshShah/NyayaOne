name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to Remote Server
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 $SSH_USER@$SERVER_IP << 'EOF'
          set -e
          cd /var/www/projects/NyayaOne
          # Genuine root cause fix: run everything as the plain "ubuntu"
          # user, never touching root at all -- ubuntu is in the "docker"
          # group so docker/docker compose need no sudo, and git as
          # ubuntu just works. Every earlier attempt to reconcile root vs
          # ubuntu ownership (chown, sudo git pull) failed because "sudo"
          # itself needs a password under GitHub Actions' non-interactive
          # SSH session for anything except (mysteriously) docker -- so
          # the real fix is to need "sudo" for nothing at all.
          git pull origin main
          # Build first (while old containers keep serving traffic), one service
          # at a time -- this small VPS chokes if all 5 services build in
          # parallel. Only THEN swap old containers for new ones, so
          # downtime is just the brief down+up gap, not the whole build.
          docker compose --parallel 1 --env-file .env.prod build
          docker compose --env-file .env.prod down
          docker compose --env-file .env.prod up -d --no-deps
          docker image prune -f
          # NOTE: build cache is intentionally NOT auto-pruned here anymore --
          # doing so after every deploy forced every following deploy to
          # rebuild from scratch (no cache), which took long enough to trip
          # SSH's connection timeout ("broken pipe"). Prune it manually
          # every so often instead: ssh in, run "docker builder prune -af".
        EOF
